<style>
  :root {
    /* Prehistoric earth palette – warm, readable, general-public friendly */
    --bg: #1c120b;
    --surface: #2a1c12;
    --surface-strong: #3a2818;
    --parchment: #f0e6d2;
    --clay: #c4a484;
    --sand: #d4b896;
    --bone: #f5f0e6;
    --moss: #6b8e4e;
    --fire: #e07a3d;
    --fire-deep: #c45c26;
    --stone: #5c4635;
    --muted: #b8a08a;
    --text: #f5f0e6;
    --success: #7a9e5a;
    --warning: #e8b86d;
    --border: rgba(196, 164, 132, 0.35);
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
  }

  body {
    min-height: 100vh;
    color: var(--text);
    background:
      radial-gradient(ellipse at 20% 10%, rgba(224, 122, 61, 0.12), transparent 45%),
      radial-gradient(ellipse at 80% 90%, rgba(107, 142, 78, 0.08), transparent 40%),
      linear-gradient(165deg, #1c120b 0%, #2a1c12 40%, #1a1009 100%);
    overflow-x: hidden;
    line-height: 1.6;
  }

  html {
    scroll-behavior: smooth;
  }

  /* ========== HEADER / NAV ========== */
  header {
    position: sticky;
    top: 0;
    z-index: 2000;
    background: rgba(26, 16, 9, 0.97);
    border-bottom: 2px solid var(--stone);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  nav {
    width: min(1180px, calc(100% - 36px));
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0;
  }

  .nav-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-top::-webkit-scrollbar {
    display: none;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fire);
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #f0c060, var(--fire-deep));
    box-shadow: 0 0 8px rgba(224, 122, 61, 0.5);
  }

  .brand .brand-crown {
    display: none;
    color: #e8c060;
    font-size: 1rem;
    align-items: center;
    gap: 6px;
  }

  .debug-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 3px 9px;
    border-radius: 4px;
    background: var(--stone);
    color: var(--sand);
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--clay);
  }

  .user-info {
    color: var(--bone);
    background: var(--surface-strong);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
  }

  .logout-btn {
    border: 1px solid var(--clay);
    background: var(--surface);
    color: var(--bone);
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 160ms ease, transform 160ms ease;
    font-size: 0.85rem;
    font-family: inherit;
  }

  .logout-btn:hover {
    background: var(--stone);
    transform: translateY(-1px);
  }

  .logout-btn.hidden-page {
    display: none;
  }

  /* ========== AUTH MODAL ========== */
  .auth-modal {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(12, 8, 4, 0.85);
    z-index: 50;
    padding: 24px;
  }

  .auth-card {
    width: min(520px, 100%);
    background: var(--surface-strong);
    border: 2px solid var(--clay);
    border-radius: 12px;
    padding: 28px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 18px;
  }

  .auth-header {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .auth-tab {
    flex: 1;
    text-align: center;
    padding: 14px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
    font-family: inherit;
  }

  .auth-tab.active {
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    border-color: var(--fire);
  }

  .auth-card input {
    width: 100%;
    border: 1px solid var(--clay);
    background: var(--bg);
    color: var(--bone);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }

  .auth-card input:focus {
    border-color: var(--fire);
  }

  .auth-submit {
    border: none;
    border-radius: 8px;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    font-weight: 700;
    cursor: pointer;
    transition: transform 150ms ease, box-shadow 150ms ease;
    font-family: inherit;
    font-size: 1rem;
  }

  .auth-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 24px rgba(224, 122, 61, 0.35);
  }

  .auth-switch {
    color: var(--muted);
    text-align: center;
    font-size: 0.95rem;
  }

  .auth-switch button {
    border: none;
    background: none;
    color: var(--fire);
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .mini-badge,
  .crown-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 8px 14px;
    border-radius: 6px;
    background: rgba(232, 192, 96, 0.15);
    color: #e8c060;
    border: 1px solid rgba(232, 192, 96, 0.35);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .premium-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .premium-status {
    font-weight: 700;
    color: #e8c060;
  }

  .premium-status.active {
    color: var(--success);
  }

  .premium-pay-link {
    display: inline-flex;
    color: var(--fire);
    text-decoration: underline;
    cursor: pointer;
    font-weight: 700;
    margin-top: 12px;
  }

  .payment-form {
    margin-top: 18px;
    display: grid;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--clay);
    border-radius: 10px;
    padding: 20px;
  }

  .payment-form.hidden-page {
    display: none;
  }

  .payment-form fieldset {
    border: none;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  .payment-form label {
    font-size: 0.95rem;
    color: var(--muted);
  }

  .payment-form input {
    width: 100%;
    border: 1px solid var(--clay);
    background: var(--bg);
    color: var(--bone);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }

  .payment-submit {
    border: none;
    border-radius: 8px;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    font-weight: 700;
    cursor: pointer;
    transition: transform 150ms ease, box-shadow 150ms ease;
    font-family: inherit;
  }

  .payment-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(224, 122, 61, 0.3);
  }

  .payment-note {
    margin-top: 10px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* ========== ADMIN ========== */
  .admin-user-list {
    display: grid;
    gap: 14px;
    margin-top: 24px;
  }

  .admin-user-card {
    display: grid;
    gap: 10px;
    padding: 18px 20px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .admin-user-card strong {
    font-size: 1rem;
    color: var(--bone);
  }

  .admin-user-card span {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .admin-user-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .admin-user-actions button {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    background: linear-gradient(135deg, #c45c26, #a04820);
    color: var(--bone);
    cursor: pointer;
    transition: transform 150ms ease, box-shadow 150ms ease;
    font-family: inherit;
  }

  .admin-user-actions button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(196, 92, 38, 0.3);
  }

  /* ========== NAV LINKS ========== */
  .nav-links {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    scrollbar-width: none;
    border-top: 1px solid var(--stone);
    padding-top: 6px;
  }

  .nav-links::-webkit-scrollbar {
    display: none;
  }

  .nav-links button {
    border: none;
    background: transparent;
    color: var(--sand);
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 6px;
    transition: all 160ms ease;
    font-size: 0.82rem;
    white-space: nowrap;
    flex: 0 0 auto;
    font-family: inherit;
  }

  .nav-links button.active,
  .nav-links button:hover {
    color: var(--bone);
    background: var(--stone);
  }

  .profile-nav-pill {
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    padding: 7px 14px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(224, 122, 61, 0.25);
    transition: transform 160ms ease, box-shadow 160ms ease;
    white-space: nowrap;
    font-family: inherit;
  }

  .profile-nav-pill:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 22px rgba(224, 122, 61, 0.35);
  }

  /* ========== HERO & ACTIONS ========== */
  .hero-actions {
    margin-top: 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .primary-action {
    border: none;
    border-radius: 8px;
    padding: 16px 24px;
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    font-size: 1rem;
    cursor: pointer;
    transition: transform 160ms ease, box-shadow 160ms ease;
    font-family: inherit;
    font-weight: 700;
  }

  .primary-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(224, 122, 61, 0.3);
  }

  .search-bar {
    flex: 1 1 260px;
    min-width: 180px;
    max-width: 340px;
  }

  .search-bar input {
    width: 100%;
    border: 1px solid var(--clay);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    background: var(--surface);
    color: var(--bone);
    outline: none;
    transition: border-color 150ms ease;
    font-family: inherit;
  }

  .search-bar input:focus {
    border-color: var(--fire);
  }

  .language-panel,
  .language-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  .language-panel select,
  .language-selector select {
    border: 1px solid var(--clay);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.82rem;
    background: var(--surface);
    color: var(--bone);
    outline: none;
    min-width: 110px;
    font-family: inherit;
  }

  .language-selector label,
  .language-panel label {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    border: 0;
    clip: rect(0 0 0 0);
    overflow: hidden;
    padding: 0;
    white-space: nowrap;
  }

  /* ========== SPLASH ========== */
  #splash {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }

  .splash-card {
    display: grid;
    gap: 24px;
    align-items: center;
    justify-items: center;
    background: var(--surface-strong);
    border: 2px solid var(--clay);
    border-radius: 16px;
    padding: 48px 42px;
    box-shadow: var(--shadow);
    max-width: 520px;
  }

  .splash-logo {
    width: 220px;
    height: 220px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at center, rgba(224, 122, 61, 0.2), transparent 60%);
    box-shadow: 0 0 40px rgba(224, 122, 61, 0.25);
    cursor: pointer;
    transition: transform 220ms ease, box-shadow 220ms ease;
    position: relative;
    border: 2px solid var(--clay);
  }

  .splash-logo::after {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 20px;
    background: radial-gradient(circle, rgba(224, 122, 61, 0.12), transparent 65%);
    opacity: 0.8;
    filter: blur(12px);
    pointer-events: none;
  }

  .splash-logo img {
    width: 160px;
    height: 160px;
    object-fit: contain;
    z-index: 1;
    position: relative;
  }

  .splash-logo:hover {
    transform: scale(1.03);
    box-shadow: 0 0 55px rgba(224, 122, 61, 0.4);
  }

  .splash-title {
    color: var(--bone);
    font-size: clamp(2.4rem, 4vw, 3.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .splash-subtitle {
    color: var(--muted);
    max-width: 440px;
    font-size: 1.05rem;
    line-height: 1.75;
  }

  .hidden-page {
    display: none !important;
  }

  /* ========== MAIN LAYOUT ========== */
  main {
    width: min(1180px, calc(100% - 36px));
    margin: 32px auto 60px;
  }

  .hero {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 32px;
    align-items: center;
    margin-bottom: 42px;
  }

  .hero-copy {
    max-width: 620px;
  }

  .hero-copy h1,
  .hero-copy h2 {
    font-size: clamp(2.4rem, 3.8vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
    color: var(--bone);
  }

  .hero-copy p {
    color: var(--muted);
    font-size: 1.08rem;
    line-height: 1.75;
    margin-bottom: 22px;
  }

  .hero-copy .quote {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(224, 122, 61, 0.12);
    border: 1px solid rgba(224, 122, 61, 0.3);
    padding: 16px 18px;
    border-radius: 10px;
    color: var(--sand);
  }

  .hero-copy .highlight {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding: 14px 18px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .hero-copy .highlight strong {
    color: var(--bone);
  }

  .hero-visual {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface);
    border: 2px solid var(--clay);
    min-height: 400px;
    box-shadow: var(--shadow);
  }

  .hero-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at top left, rgba(224, 122, 61, 0.15), transparent 35%),
      radial-gradient(circle at bottom right, rgba(107, 142, 78, 0.1), transparent 35%);
    pointer-events: none;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 28px;
    margin-top: 32px;
    align-items: start;
  }

  #post-it,
  #swapify-ai {
    background: transparent;
  }

  @media (max-width: 980px) {
    .dashboard-grid {
      grid-template-columns: 1fr;
    }
  }

  .hero-visual .panel {
    position: absolute;
    width: 100%;
    height: 100%;
    padding: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    z-index: 1;
    color: var(--bone);
  }

  .card {
    background: rgba(42, 28, 18, 0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card h3 {
    font-size: 1.05rem;
    color: var(--sand);
  }

  .card p {
    color: var(--muted);
    line-height: 1.65;
    font-size: 0.95rem;
  }

  .stat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 18px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .stat strong {
    font-size: 1.45rem;
    color: var(--fire);
  }

  section {
    margin-top: 18px;
    scroll-margin-top: 96px;
  }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 16px;
  }

  .section-title h2 {
    font-size: 1.65rem;
    letter-spacing: -0.02em;
    color: var(--bone);
  }

  .section-title span {
    color: var(--muted);
  }

  .intro-card {
    padding: 26px 28px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
  }

  .intro-card p {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.75;
  }

  /* ========== POST FORM ========== */
  .post-form {
    display: grid;
    gap: 18px;
    grid-template-columns: 1fr 1fr;
  }

  .category-picker {
    position: relative;
  }

  .category-trigger {
    width: 100%;
    border: 1px solid var(--clay);
    background: var(--bg);
    color: var(--bone);
    border-radius: 8px;
    padding: 16px 18px;
    outline: none;
    font-size: 0.97rem;
    transition: border 150ms ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    font-family: inherit;
  }

  .category-trigger:focus,
  .category-trigger:hover {
    border-color: var(--fire);
  }

  .category-trigger .chevron {
    color: var(--muted);
    font-size: 0.85rem;
  }

  .category-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    z-index: 30;
    display: grid;
    gap: 4px;
    padding: 8px;
    border-radius: 10px;
    background: var(--surface-strong);
    border: 1px solid var(--clay);
    box-shadow: var(--shadow);
    max-height: 240px;
    overflow-y: auto;
  }

  .other-category-wrap {
    grid-column: 1 / -1;
    display: none;
    gap: 10px;
    margin-top: -4px;
  }

  .other-category-wrap.visible {
    display: grid;
  }

  .other-category-wrap label {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .category-option {
    border: none;
    background: transparent;
    color: var(--bone);
    text-align: left;
    padding: 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    font-family: inherit;
  }

  .category-option:hover,
  .category-option.is-selected {
    background: linear-gradient(135deg, rgba(224, 122, 61, 0.35), rgba(196, 92, 38, 0.3));
    color: var(--bone);
  }

  .post-form textarea,
  .post-form input,
  .post-form select {
    width: 100%;
    border: 1px solid var(--clay);
    background: var(--bg);
    color: var(--bone);
    border-radius: 8px;
    padding: 16px 18px;
    outline: none;
    font-size: 0.97rem;
    transition: border 150ms ease;
    font-family: inherit;
    color-scheme: dark;
  }

  .post-form input:focus,
  .post-form textarea:focus,
  .post-form select:focus {
    border-color: var(--fire);
  }

  .post-form textarea {
    grid-column: 1 / -1;
    min-height: 140px;
    resize: vertical;
  }

  .post-form input[type="file"] {
    grid-column: 1 / -1;
    width: 100%;
    border: 1px solid var(--fire);
    background: linear-gradient(135deg, var(--fire), var(--fire-deep));
    color: var(--bone);
    border-radius: 8px;
    padding: 12px 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(224, 122, 61, 0.25);
    font-family: inherit;
  }

  .post-form input[type="file"]::file-selector-button {
    border: 1px solid rgba(245, 240, 230, 0.3);
    background: rgba(245, 240, 230, 0.15);
    color: var(--bone);
    border-radius: 6px;
    padding: 10px 14px;
    margin-right: 12px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
  }

  .file-note {
    grid-column: 1 / -1;
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: -8px;
    margin-bottom: 12px;
  }

  .media-preview {
    grid-column: 1 / -1;
    display: grid;
    gap: 14px;
    padding: 16px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
