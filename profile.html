<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swapify Profile</title>
  <style>
    :root {
      --bg: #050a18;
      --surface: rgba(11, 23, 42, 0.95);
      --accent: #4f8cff;
      --text: #f3f7ff;
      --muted: #a8b7d6;
      --success: #62d6a7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { min-height: 100vh; background: linear-gradient(180deg, #091224 0%, #02060f 100%); color: var(--text); }
    header { position: fixed !important; top: 0; left: 0; right: 0; width: 100%; background: rgba(3, 10, 22, 0.92); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 1000; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); }
    .brand .dot { width: 12px; height: 12px; border-radius: 999px; background: linear-gradient(135deg, #4f8cff, #9b59ff); }
    .profile-badge { background: rgba(79, 140, 255, 0.12); color: #cff2ff; padding: 10px 14px; border-radius: 999px; }
    .page-link { border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.04); color: var(--text); border-radius: 18px; padding: 12px 18px; text-decoration: none; transition: transform 150ms ease, background 150ms ease; }
    .page-link:hover { background: rgba(79,140,255,0.18); transform: translateY(-1px); }
    main { width: min(1100px, calc(100% - 36px)); margin: 104px auto 60px; display: grid; gap: 24px; }
    .hero-panel { background: var(--surface); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 28px; display: grid; gap: 20px; }
    .hero-panel h1 { font-size: clamp(2rem, 3vw, 2.8rem); line-height: 1.05; }
    .hero-panel p { color: var(--muted); line-height: 1.8; }
    .profile-summary { display: grid; gap: 12px; padding: 24px; border-radius: 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
    .profile-summary strong { font-size: 1.1rem; }
    .item-feed { display: grid; gap: 18px; }
    .item-card { background: rgba(8, 15, 30, 0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; padding: 24px; display: grid; gap: 18px; }
    .item-card h3 { margin-bottom: 6px; }
    .item-card p { color: var(--muted); line-height: 1.75; }
    .item-image { width: 100%; max-height: 260px; object-fit: cover; border-radius: 20px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); color: var(--muted); font-size: 0.9rem; }
    .badge span { color: var(--text); font-weight: 600; }
    .chat-thread { display: grid; gap: 12px; padding: 16px; border-radius: 22px; background: rgba(255,255,255,0.03); border: 1px solid rgba(79,140,255,0.14); }
    .chat-message { padding: 16px; border-radius: 20px; background: rgba(4, 11, 24, 0.96); border: 1px solid rgba(255,255,255,0.08); }
    .chat-message strong { display: block; margin-bottom: 8px; color: #a8c3ff; font-size: 0.92rem; }
    .chat-empty { padding: 14px; border-radius: 18px; background: rgba(255,255,255,0.04); color: var(--muted); text-align: center; }
    .empty-state { padding: 24px; border-radius: 24px; background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); color: var(--muted); text-align: center; }
    .value-row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .value-row div { background: rgba(255,255,255,0.04); padding: 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); }
    .value-row div strong { display: block; font-size: 1.2rem; margin-bottom: 6px; }
    @media (max-width: 820px) { .value-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span>Swapify</span>
    </div>
    <div class="profile-badge" id="profileStatus">Profile</div>
    <a class="page-link" href="index.html">Back to Home</a>
  </header>

  <main>
    <section class="hero-panel">
      <h1>Your Swapify Profile</h1>
      <p>View your posted listings, trade request counts, and chat messages from people who are interested in trading with you.</p>
      <div class="value-row">
        <div><strong id="postCount">0</strong><span>Items posted</span></div>
        <div><strong id="requestCount">0</strong><span>Total trade requests</span></div>
      </div>
    </section>

    <section class="profile-summary" id="profileSummary"></section>
    <section class="item-feed" id="profileFeed"></section>
  </main>

  <script>
    const apiBase = '/api';
    const profileSummary = document.getElementById('profileSummary');
    const profileFeed = document.getElementById('profileFeed');
    const postCount = document.getElementById('postCount');
    const requestCount = document.getElementById('requestCount');
    const profileStatus = document.getElementById('profileStatus');
    const currentUser = JSON.parse(localStorage.getItem('swapify-current-user') || 'null');

    async function apiFetch(path, options = {}) {
      const response = await fetch(`${apiBase}${path}`, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        ...options
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || response.statusText);
      }
      return response.json();
    }

    async function getItems() {
      return apiFetch('/items');
    }

    function normalizeUsername(username) {
      return String(username || '').trim().toLowerCase();
    }

    function renderChatSection(chats) {
      if (!chats || !chats.length) {
        return '<div class="chat-empty">No trade request chats yet. People will appear here once they send a message.</div>';
      }
      return `<div class="chat-thread">${chats.map(chat => `
        <div class="chat-message">
          <strong>${chat.from || 'Guest'} • ${chat.createdAt ? new Date(chat.createdAt).toLocaleString() : 'No time'}</strong>
          <p>${chat.message}</p>
        </div>
      `).join('')}</div>`;
    }

    function createItemCard(data) {
      const imageSection = data.image ? `<img class="item-image" src="${data.image}" alt="${data.name}" />` : '';
      const tradeRequestSummary = (data.interestedChats || []).length ? `<div class="badge">Trade requests: <span>${data.interestedChats.length}</span></div>` : '<div class="badge"><span>No trade requests yet</span></div>';
      const chatSection = renderChatSection(data.interestedChats || []);
      return `<div class="item-card">
        ${imageSection}
        <h3>${data.name}</h3>
        <div class="badge">Category: <span>${data.category}</span></div>
        <div class="badge">Condition: <span>${data.condition}</span></div>
        <div class="badge">Wants: <span>${data.exchange}</span></div>
        ${tradeRequestSummary}
        <p>${data.description}</p>
        ${chatSection}
      </div>`;
    }

    function getMyPostedItems(items) {
      if (!currentUser || !items) return [];
      return items.filter(item => normalizeUsername(item.postedBy) === normalizeUsername(currentUser.username));
    }

    async function loadProfile() {
      if (!currentUser) {
        profileSummary.innerHTML = '<p>Please sign in through the Swapify homepage to view your profile.</p>';
        profileFeed.innerHTML = '<div class="empty-state">No profile available. <a class="page-link" href="index.html">Go to Swapify</a></div>';
        profileStatus.textContent = 'Not signed in';
        return;
      }

      profileStatus.textContent = `${currentUser.username} ${currentUser.admin ? '👑 Admin' : currentUser.premium ? '👑 Premium' : ''}`;
      try {
        const items = await getItems();
        const userPosts = getMyPostedItems(items);
        postCount.textContent = userPosts.length;
        requestCount.textContent = userPosts.reduce((sum, item) => sum + ((item.interestedChats || []).length), 0);

        profileSummary.innerHTML = `
          <strong>${currentUser.username}</strong>
          <p>${currentUser.email || 'No email provided'}</p>
          <p>${currentUser.phone ? `Phone: ${currentUser.phone}` : 'No phone number on file'}</p>
          <p>You have ${userPosts.length} active post${userPosts.length === 1 ? '' : 's'} and ${requestCount.textContent} trade request${requestCount.textContent === '1' ? '' : 's'}.</p>
        `;

        if (!userPosts.length) {
          profileFeed.innerHTML = '<div class="empty-state">You have not posted any items yet. Return to the homepage and add a listing to start receiving trade requests.</div>';
          return;
        }

        profileFeed.innerHTML = userPosts.map(createItemCard).join('');
      } catch (error) {
        profileSummary.innerHTML = '<p>Unable to load profile data. Please refresh the page.</p>';
        profileFeed.innerHTML = '<div class="empty-state">Error loading your listings.</div>';
        console.error(error);
      }
    }

    window.addEventListener('load', loadProfile);
  </script>
<!-- ... rest of your HTML layout ... -->

      async function fetchItems() {
        const response = await fetch(`${API_BASE_URL}/api/items`);
        const data = await response.json();
        console.log(data);
      }
    </script>
  </body>
</html>
